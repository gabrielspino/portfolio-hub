<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PortfolioHUB - Plataforma Centralizada</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #121212; color: #e0e0e0; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background-color: #1e1e1e; padding: 40px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); text-align: center; max-width: 600px; border-top: 4px solid #bb86fc; }

        p { color: #a0a0a0; line-height: 1.6; }

<body>
    <div class="container">
        <h1>PortfolioHUB</h1>
        <p>Plataforma centralizada para gestão de projetos e portfólios digitais.</p>

    </div>
